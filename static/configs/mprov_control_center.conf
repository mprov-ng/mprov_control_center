# Sized for a fleet boot (#535): when hundreds of nodes PXE-boot at once,
# each makes several mPCC calls in its first seconds.  Two GIL-bound
# processes used under 3 cores and mod_wsgi's default listen backlog (100)
# overflowed, so nodes got 503s and timeouts.  listen-backlog is the queue
# in front of the daemon processes; ListenBacklog is Apache's own accept
# queue (the kernel caps both at net.core.somaxconn).
# init_mpcc.sh sets MPROV_WSGI_PROCESSES from the CPU count (2 to 8), or
# takes it from the container's environment.
WSGIDaemonProcess mprov.mpcc processes=${MPROV_WSGI_PROCESSES} threads=15 listen-backlog=1024 lang='en_US.UTF-8' locale='en_US.UTF-8' python-home=/var/www/mprov_control_center/ python-path=/var/www/mprov_control_center/
WSGIScriptAlias / /var/www/mprov_control_center/mprov_control_center/wsgi.py  process-group=mprov.mpcc application-group=%{GLOBAL}
WSGIPythonHome /var/www/mprov_control_center/
WSGIPythonPath /var/www/mprov_control_center/
WSGIProcessGroup mprov.mpcc
WSGIPassAuthorization On
WSGIRestrictEmbedded On
ListenBacklog 4096

# Under load httpd closes idle keep-alive connections, and a node's next
# request on its reused connection fails (RemoteDisconnected).  Nodes and
# job servers make a few calls each, so they gain little from keep-alive:
# keep it only for the admin pages and their static files.
SetEnvIfExpr "%{REQUEST_URI} !~ m#^/+(admin|static)(/|$)#" nokeepalive

<Directory /var/www/mprov_control_center/mprov_control_center/>
        <Files wsgi.py>
                Require all granted
        </Files>
</Directory>
# The container's Dockerfile sends the access log to stdout, in httpd.conf
# and ssl.conf; another TransferLog here would log each request twice.
ErrorLog /dev/stdout
Alias /robots.txt /var/www/mprov_control_center/static/robots.txt
Alias /favicon.ico /var/www/mprov_control_center/static/mProvLogo.png

Alias /media/ /var/www/mprov_control_center/media/
Alias /static/ /var/www/mprov_control_center/static/

<Directory /var/www/mprov_control_center/static>
Require all granted
</Directory>

<Directory /var/www/mprov_control_center/media>
Require all granted
</Directory>

# Nodes and job servers fetch scripts and files from media/, always from a
# subdirectory: <script type>/..., files/... (scripts/models.py).  The
# default SQLite database is media/db.sqlite3 (db/ is a symlink to media/),
# so never serve a file at the top of media/, any SQLite file, or an
# mprov_backup directory written under media/.  "/+" because this httpd
# doesn't merge repeated slashes before matching.
<LocationMatch "^/+media/+[^/]*$">
Require all denied
</LocationMatch>
<LocationMatch "^/+media/.*\.sqlite3">
Require all denied
</LocationMatch>
<LocationMatch "^/+media/(.*/)?mprov-backup-">
Require all denied
</LocationMatch>

<Location "/secret">
    AuthType Basic
    AuthName "Top Secret"
    Require valid-user
    AuthBasicProvider wsgi
    WSGIAuthUserScript /var/www/mprov_control_center/mprov_control_center/wsgi.py
</Location>

# we need to up the workers.
<IfModule mpm_prefork_module>
      StartServers              10
      MinSpareServers           10
      MaxSpareServers           20
      ServerLimit               2000
      MaxRequestWorkers         1500
      MaxConnectionsPerChild    10000
</IfModule>
