# Inserted into ssl.conf's port 443 VirtualHost by the Dockerfile (#381).
# Ask for a client certificate, without requiring one: browsers, mash and
# anonymous downloads carry none.  A certificate must be from the mPCC's own
# CA, so a node or job server can prove which one it is.  Pass the verified
# certificate to Django (SSL_CLIENT_VERIFY, SSL_CLIENT_CERT, ...).
SSLCACertificateFile ${MPROV_TLS_CA}
SSLVerifyClient optional
SSLVerifyDepth 1
SSLOptions +StdEnvVars +ExportCertData
