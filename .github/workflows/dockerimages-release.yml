name: Docker Image CI for Release
on:
  release: 
    types: [published]
  # A pull request that changes this workflow or the shared tests runs it as
  # a dry run: build and test, no login, no push.
  pull_request:
    paths:
      - '.github/workflows/dockerimages-release.yml'
      - '.github/actions/mpcc-tests/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - 
        name: Checkout 
        uses: actions/checkout@v7
      
      - 
        name: Setup buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # Build without pushing, so the release is only published once the
      # tests pass, like :dev (#333).  No layer cache: a release gets a fresh
      # dnf update.
      - 
        name: Build the release image
        uses: docker/build-push-action@v7
        with:
          tags: mpcc-release:test
          load: true
          push: false

      -
        name: Run the tests
        uses: ./.github/actions/mpcc-tests
        with:
          image: mpcc-release:test

      - 
        name: Login to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      -
        name: Publish the release image
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker tag mpcc-release:test "ghcr.io/mprov-ng/mprov-control-center:$TAG"
          docker tag mpcc-release:test ghcr.io/mprov-ng/mprov-control-center:latest
          docker push "ghcr.io/mprov-ng/mprov-control-center:$TAG"
          docker push ghcr.io/mprov-ng/mprov-control-center:latest
