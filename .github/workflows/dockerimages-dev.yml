name: Docker Image CI for Dev
on:
  push:
    branches:
      - main
    # Skip the build when a push only touches files that .dockerignore
    # keeps out of the image.  Keep this list in sync with .dockerignore.
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - 'REVIEW-2026-10.md'
      - '.vscode/**'
      - '*.code-workspace'
      - '.env'
      - '.env.*'
      - 'env.db'
      - 'install_scripts/env.db'
      - 'id_rsa'
      - 'id_rsa.pub'
      - 'bin/**'
      - 'lib/**'
      - 'lib64'
      - 'lib64/**'
      - 'pyvenv.cfg'
      - '**/__pycache__/**'
      - '*.py[cod]'
      - 'media/**'
      - 'db'
      - 'db/**'
      - '.dev.init'
      - 'backups/**'
      - '!backups/README.md'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - 
        name: Checkout 
        uses: actions/checkout@v7
      
      - 
        name: Setup buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - 
        name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      - 
        name: Build Development Docker Image
        uses: docker/build-push-action@v7
        with:
          tags: |
            ghcr.io/mprov-ng/mprov-control-center:dev
          push: true