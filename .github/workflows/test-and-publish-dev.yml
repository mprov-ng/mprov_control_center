name: Test and Publish Dev Image
on:
  pull_request:
    paths-ignore:
      # Skip changes that can't affect the tests: files .dockerignore keeps
      # out of the image, plus docs.  Changes to this workflow still run it.
      - '.github/**'
      - '!.github/workflows/test-and-publish-dev.yml'
      - '.gitignore'
      - 'REVIEW-2026-10.md'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.vscode/**'
      - '*.code-workspace'
      - '.env'
      - '.env.*'
      - 'env.db'
      - 'install_scripts/env.db'
      - 'id_rsa'
      - 'id_rsa.pub'
      - 'bin/**'
      - 'lib/**'
      - 'lib64'
      - 'lib64/**'
      - 'pyvenv.cfg'
      - '**/__pycache__/**'
      - '*.py[cod]'
      - 'media/**'
      - 'db'
      - 'db/**'
      - '.dev.init'
      - 'backups/**'
  push:
    branches:
      - main
    paths-ignore:
      # Skip changes that can't affect the tests: files .dockerignore keeps
      # out of the image, plus docs.  Changes to this workflow still run it.
      - '.github/**'
      - '!.github/workflows/test-and-publish-dev.yml'
      - '.gitignore'
      - 'REVIEW-2026-10.md'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.vscode/**'
      - '*.code-workspace'
      - '.env'
      - '.env.*'
      - 'env.db'
      - 'install_scripts/env.db'
      - 'id_rsa'
      - 'id_rsa.pub'
      - 'bin/**'
      - 'lib/**'
      - 'lib64'
      - 'lib64/**'
      - 'pyvenv.cfg'
      - '**/__pycache__/**'
      - '*.py[cod]'
      - 'media/**'
      - 'db'
      - 'db/**'
      - '.dev.init'
      - 'backups/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Setup buildx
        uses: docker/setup-buildx-action@v4

      # Build the same image that ships, so the tests run against the real
      # dependencies.  On a push to main this image is published as :dev
      # once the tests pass.
      # Pull requests reuse the layer cache to skip the dnf layer and the
      # mirrors.  Pushes to main build without it, so the published image
      # gets a fresh dnf update (security updates), and refresh the cache
      # for later pull requests.
      -
        name: Build Test Docker Image
        uses: docker/build-push-action@v7
        with:
          tags: mpcc-test:ci
          load: true
          push: false
          no-cache: ${{ github.event_name == 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Includes MigrationsTest, which fails if a model change has no
      # migration committed for it.
      -
        name: Run Django Tests
        run: |
          docker run --rm --entrypoint bash mpcc-test:ci -c '
            cd /var/www/mprov_control_center &&
            . bin/activate &&
            export SECRET_KEY="$(python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())")" &&
            python manage.py check &&
            python manage.py test
          '

      # Production runs on MariaDB (mprov-compose ships mariadb:10.11), and
      # some queries behave differently there than on SQLite (#385), so the
      # whole suite runs against it too.  Throwaway container and password.
      -
        name: Run Django Tests on MariaDB
        run: |
          docker network create mpcc-ci
          docker run -d --name mpcc-ci-db --network mpcc-ci \
            -e MARIADB_ROOT_PASSWORD=ci -e MARIADB_DATABASE=mprov mariadb:10.11
          for i in $(seq 1 60); do
            docker exec mpcc-ci-db healthcheck.sh --connect --innodb_initialized && break
            sleep 2
          done
          docker run --rm --network mpcc-ci \
            -e DB_ENGINE=django.db.backends.mysql -e DB_NAME=mprov -e DB_USER=root \
            -e DB_PASS=ci -e DB_HOST=mpcc-ci-db -e DB_PORT=3306 \
            --entrypoint bash mpcc-test:ci -c '
            cd /var/www/mprov_control_center &&
            . bin/activate &&
            export SECRET_KEY="$(python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())")" &&
            python manage.py test --noinput
          '

      # Publish the image that was just tested as :dev.  Only for pushes to
      # main; pull requests stop after the tests.
      -
        name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      -
        name: Publish Development Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag mpcc-test:ci ghcr.io/mprov-ng/mprov-control-center:dev
          docker push ghcr.io/mprov-ng/mprov-control-center:dev
