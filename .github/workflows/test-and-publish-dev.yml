name: Test and Publish Dev Image
on:
  pull_request:
    paths-ignore:
      # Skip changes that can't affect the tests: files .dockerignore keeps
      # out of the image, plus docs.  Changes to this workflow or to the
      # shared tests in .github/actions/mpcc-tests still run it.
      - '.github/**'
      - '!.github/workflows/test-and-publish-dev.yml'
      - '!.github/actions/**'
      - '.gitignore'
      - 'REVIEW-2026-10.md'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.vscode/**'
      - '*.code-workspace'
      - '.env'
      - '.env.*'
      - 'env.db'
      - 'install_scripts/env.db'
      - 'id_rsa'
      - 'id_rsa.pub'
      - 'bin/**'
      - 'lib/**'
      - 'lib64'
      - 'lib64/**'
      - 'pyvenv.cfg'
      - '**/__pycache__/**'
      - '*.py[cod]'
      - 'media/**'
      - 'db'
      - 'db/**'
      - '.dev.init'
      - 'backups/**'
  push:
    branches:
      - main
    paths-ignore:
      # Skip changes that can't affect the tests: files .dockerignore keeps
      # out of the image, plus docs.  Changes to this workflow or to the
      # shared tests in .github/actions/mpcc-tests still run it.
      - '.github/**'
      - '!.github/workflows/test-and-publish-dev.yml'
      - '!.github/actions/**'
      - '.gitignore'
      - 'REVIEW-2026-10.md'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.vscode/**'
      - '*.code-workspace'
      - '.env'
      - '.env.*'
      - 'env.db'
      - 'install_scripts/env.db'
      - 'id_rsa'
      - 'id_rsa.pub'
      - 'bin/**'
      - 'lib/**'
      - 'lib64'
      - 'lib64/**'
      - 'pyvenv.cfg'
      - '**/__pycache__/**'
      - '*.py[cod]'
      - 'media/**'
      - 'db'
      - 'db/**'
      - '.dev.init'
      - 'backups/**'

# One run per ref (refs/heads/main, or a pull request's own ref).  A newer
# push cancels the older run still in progress, so the run that publishes
# :dev is always for the newest commit on main; without this, overlapping
# runs race and the last one to finish wins, which can be an older commit
# (#404).  A pull request only cancels its own previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Setup buildx
        uses: docker/setup-buildx-action@v4

      # Build the same image that ships, so the tests run against the real
      # dependencies.  On a push to main this image is published as :dev
      # once the tests pass.
      # Pull requests reuse the layer cache to skip the dnf layer and the
      # mirrors.  Pushes to main build without it, so the published image
      # gets a fresh dnf update (security updates), and refresh the cache
      # for later pull requests.
      -
        name: Build Test Docker Image
        uses: docker/build-push-action@v7
        with:
          tags: mpcc-test:ci
          load: true
          push: false
          no-cache: ${{ github.event_name == 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same tests the release workflow runs (#333).
      -
        name: Run the tests
        uses: ./.github/actions/mpcc-tests
        with:
          image: mpcc-test:ci

      # Publish the image that was just tested as :dev.  Only for pushes to
      # main; pull requests stop after the tests.
      -
        name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      -
        name: Publish Development Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag mpcc-test:ci ghcr.io/mprov-ng/mprov-control-center:dev
          docker push ghcr.io/mprov-ng/mprov-control-center:dev
