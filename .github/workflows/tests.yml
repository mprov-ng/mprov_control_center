name: Tests
on:
  pull_request:
    paths-ignore:
      # Skip changes that can't affect the tests: files .dockerignore keeps
      # out of the image (the same list as dockerimages-dev.yml), plus docs.
      # Changes to this workflow still run it.
      - '.github/**'
      - '!.github/workflows/tests.yml'
      - '.gitignore'
      - 'REVIEW-2026-10.md'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.vscode/**'
      - '*.code-workspace'
      - '.env'
      - '.env.*'
      - 'env.db'
      - 'install_scripts/env.db'
      - 'id_rsa'
      - 'id_rsa.pub'
      - 'bin/**'
      - 'lib/**'
      - 'lib64'
      - 'lib64/**'
      - 'pyvenv.cfg'
      - '**/__pycache__/**'
      - '*.py[cod]'
      - 'media/**'
      - 'db'
      - 'db/**'
      - '.dev.init'
      - 'backups/**'
  push:
    branches:
      - main
    paths-ignore:
      # Skip changes that can't affect the tests: files .dockerignore keeps
      # out of the image (the same list as dockerimages-dev.yml), plus docs.
      # Changes to this workflow still run it.
      - '.github/**'
      - '!.github/workflows/tests.yml'
      - '.gitignore'
      - 'REVIEW-2026-10.md'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.vscode/**'
      - '*.code-workspace'
      - '.env'
      - '.env.*'
      - 'env.db'
      - 'install_scripts/env.db'
      - 'id_rsa'
      - 'id_rsa.pub'
      - 'bin/**'
      - 'lib/**'
      - 'lib64'
      - 'lib64/**'
      - 'pyvenv.cfg'
      - '**/__pycache__/**'
      - '*.py[cod]'
      - 'media/**'
      - 'db'
      - 'db/**'
      - '.dev.init'
      - 'backups/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Setup buildx
        uses: docker/setup-buildx-action@v4

      # Build the same image that ships, without pushing it, so the tests
      # run against the real dependencies.
      # The layer cache lets most runs reuse the dnf layer and skip the
      # mirrors. Only this workflow caches: the dev and release builds must
      # run a fresh dnf update every time to pick up security updates.
      -
        name: Build Test Docker Image
        uses: docker/build-push-action@v7
        with:
          tags: mpcc-test:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Includes MigrationsTest, which fails if a model change has no
      # migration committed for it.
      -
        name: Run Django Tests
        run: |
          docker run --rm --entrypoint bash mpcc-test:ci -c '
            cd /var/www/mprov_control_center &&
            . bin/activate &&
            export SECRET_KEY="$(python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())")" &&
            python manage.py check &&
            python manage.py test
          '
