name: mPCC tests
description: >
  Runs manage.py check and the Django tests in a built mPCC image, on SQLite
  and on MariaDB.  Used by the dev and release workflows, so both publish
  only an image that passed the same tests (#333).
inputs:
  image:
    description: The locally loaded image to test.
    required: true
runs:
  using: composite
  steps:
    # Includes MigrationsTest, which fails if a model change has no
    # migration committed for it.
    -
      name: Run Django Tests
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        docker run --rm --entrypoint bash "$IMAGE" -c '
          cd /var/www/mprov_control_center &&
          . bin/activate &&
          export SECRET_KEY="$(python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())")" &&
          python manage.py check &&
          python manage.py test
        '

    # Production runs on MariaDB (mprov-compose ships mariadb:10.11), and
    # some queries behave differently there than on SQLite (#385), so the
    # whole suite runs against it too.  Throwaway container and password.
    -
      name: Run Django Tests on MariaDB
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        docker network create mpcc-ci
        docker run -d --name mpcc-ci-db --network mpcc-ci \
          -e MARIADB_ROOT_PASSWORD=ci -e MARIADB_DATABASE=mprov mariadb:10.11
        for i in $(seq 1 60); do
          docker exec mpcc-ci-db healthcheck.sh --connect --innodb_initialized && break
          sleep 2
        done
        docker run --rm --network mpcc-ci \
          -e DB_ENGINE=django.db.backends.mysql -e DB_NAME=mprov -e DB_USER=root \
          -e DB_PASS=ci -e DB_HOST=mpcc-ci-db -e DB_PORT=3306 \
          --entrypoint bash "$IMAGE" -c '
          cd /var/www/mprov_control_center &&
          . bin/activate &&
          export SECRET_KEY="$(python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())")" &&
          python manage.py test --noinput
        '

    # Apache serves media/ for the scripts nodes fetch, and the default
    # SQLite database lives there too, so start the image as a site would
    # and check over HTTP that the database and backups aren't served while
    # a script still is.
    -
      name: Check what Apache serves from media/
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        docker run -d --name mpcc-ci-http "$IMAGE"
        for i in $(seq 1 90); do
          docker exec mpcc-ci-http curl -sf -o /dev/null http://localhost/ && break
          sleep 5
        done
        docker exec mpcc-ci-http bash -c '
          cd /var/www/mprov_control_center && . bin/activate &&
          python manage.py mprov_backup --output-dir media >/dev/null'
        status() { docker exec mpcc-ci-http curl -s --path-as-is -o /dev/null -w '%{http_code}' "http://localhost$1"; }
        script=$(docker exec mpcc-ci-http bash -c 'cd /var/www/mprov_control_center/media && ls -d */* | grep -v mprov-backup- | head -1')
        backup=$(docker exec mpcc-ci-http bash -c 'cd /var/www/mprov_control_center/media && ls -d mprov-backup-*/manifest.json')
        fail=0
        for path in /media/db.sqlite3 //media//db.sqlite3 /media/x/../db.sqlite3 "/media/$backup"; do
          code=$(status "$path")
          echo "$path: $code"
          [ "$code" = 403 ] || { echo "::error::$path is served ($code)"; fail=1; }
        done
        code=$(status "/media/$script")
        echo "/media/$script: $code"
        [ "$code" = 200 ] || { echo "::error::the script /media/$script isn't served ($code)"; fail=1; }
        docker rm -f mpcc-ci-http >/dev/null
        exit $fail
