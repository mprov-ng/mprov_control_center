name: mPCC tests
description: >
  Runs manage.py check and the Django tests in a built mPCC image, on SQLite
  and on MariaDB.  Used by the dev and release workflows, so both publish
  only an image that passed the same tests (#333).
inputs:
  image:
    description: The locally loaded image to test.
    required: true
runs:
  using: composite
  steps:
    # Includes MigrationsTest, which fails if a model change has no
    # migration committed for it.
    -
      name: Run Django Tests
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        docker run --rm --entrypoint bash "$IMAGE" -c '
          cd /var/www/mprov_control_center &&
          . bin/activate &&
          export SECRET_KEY="$(python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())")" &&
          python manage.py check &&
          python manage.py test
        '

    # Production runs on MariaDB (mprov-compose ships mariadb:10.11), and
    # some queries behave differently there than on SQLite (#385), so the
    # whole suite runs against it too.  Throwaway container and password.
    -
      name: Run Django Tests on MariaDB
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        docker network create mpcc-ci
        docker run -d --name mpcc-ci-db --network mpcc-ci \
          -e MARIADB_ROOT_PASSWORD=ci -e MARIADB_DATABASE=mprov mariadb:10.11
        for i in $(seq 1 60); do
          docker exec mpcc-ci-db healthcheck.sh --connect --innodb_initialized && break
          sleep 2
        done
        docker run --rm --network mpcc-ci \
          -e DB_ENGINE=django.db.backends.mysql -e DB_NAME=mprov -e DB_USER=root \
          -e DB_PASS=ci -e DB_HOST=mpcc-ci-db -e DB_PORT=3306 \
          --entrypoint bash "$IMAGE" -c '
          cd /var/www/mprov_control_center &&
          . bin/activate &&
          export SECRET_KEY="$(python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())")" &&
          python manage.py test --noinput
        '
