{% extends "admin/submit_line.html" %}
{% load i18n admin_urls %}

{% block extra-actions %}
    <!-- Rebuild now (#176): saves the form and queues a rebuild of this image. -->
    {% if original.pk %}
        <input type="submit" value="{% translate 'Rebuild now' %}" name="_rebuild_now" class="btn btn-sm btn-warning"
               title="{% translate 'Save, then queue a rebuild of this image on the job servers' %}">
    {% endif %}
{% endblock %}
